name: Build Cordova Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Build Web Assets for Cordova
        run: npm run build:cordova

      - name: Add Android Platform
        run: cordova platform add android@13

      - name: Build Android Debug APK
        run: cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: b2b-lead-pro-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
